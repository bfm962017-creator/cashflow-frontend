<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--pri:#2457d6;--in:#12805c;--out:#c2362b;--inb:#e3f5ee;--outb:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2228;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b;--pri:#6c93f5;--in:#4cc9a0;--out:#ff8a7d;--inb:#14332a;--outb:#3a1f1c}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2228;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b;--pri:#6c93f5;--in:#4cc9a0;--out:#ff8a7d;--inb:#14332a;--outb:#3a1f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:10px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);padding:9px 14px;border-radius:8px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.top .who{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:12px;padding:12px;border:1px solid var(--bd);background:var(--card)}
.stat small{color:var(--mut);display:block}.stat b{font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1}
.seg button.on.i{background:var(--inb);border-color:var(--in);color:var(--in)}
.seg button.on.o{background:var(--outb);border-color:var(--out);color:var(--out)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}.tx .n{font-weight:500}.tx .m{color:var(--mut);font-size:12px}
.tx .a{text-align:right;white-space:nowrap}
.err{color:var(--out);font-size:13px;min-height:18px}
.mut{color:var(--mut)}
.ctr{max-width:380px;margin:8vh auto 0}
.scroll{overflow-x:auto}
.chart{display:flex;gap:4px;height:130px}.bc{flex:1;display:flex;flex-direction:column;align-items:center}
.bb{flex:1;display:flex;align-items:flex-end;gap:1px;width:100%}.bb i{flex:1;display:block;min-height:1px;border-radius:2px 2px 0 0}
.bi{background:var(--in)}.bo{background:var(--out)}.bc small{font-size:10px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.leg{font-size:12px;color:var(--mut);margin-top:6px}.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

:root{--hb:#2196f3;--g:#43a047;--r:#e53935}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hb:#1c4f86}}
:root[data-theme="dark"]{--hb:#1c4f86}
.wrap{max-width:640px;padding:0}.wrap>.ctr{width:calc(100% - 24px)}
.pad{padding:12px}.tx-pg{padding-bottom:160px}
.hdr{background:var(--hb);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ht{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.mbtn{font-size:22px;line-height:1;padding:4px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drw{position:fixed;top:0;bottom:0;left:0;width:min(290px,82vw);background:var(--card);z-index:21;display:flex;flex-direction:column;overflow-y:auto;box-shadow:2px 0 16px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.drw.an{animation:dslide .2s ease-out}.ov.an{animation:dfade .2s}
@keyframes dslide{from{transform:translateX(-100%)}}@keyframes dfade{from{opacity:0}}
.dhd{background:var(--hb);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;gap:12px;align-items:center}
.dhd b{display:block;font-size:16px}.dhd small{opacity:.85;font-size:12px}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;color:#1565c0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.dsec{padding:12px 16px 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:12px 16px;font-size:15px}
.mi.on{background:var(--bg);color:var(--pri);font-weight:600}.mi span{width:22px;text-align:center}
.dft{margin-top:auto;border-top:1px solid var(--bd)}
.drw.rt{left:auto;right:0;width:min(360px,92vw);box-shadow:-2px 0 16px rgba(0,0,0,.25)}.drw.rt.an{animation:dslider .2s ease-out}
@keyframes dslider{from{transform:translateX(100%)}}
.dhd.nh{justify-content:space-between}.dhd.nh b{font-size:17px}
.bell{position:relative;padding:7px 9px;line-height:0}
.bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e53935;color:#fff;font-size:11px;font-weight:700;line-height:15px;border:2px solid var(--hb)}
.ai{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);position:relative}
.ai.nw{background:var(--bg)}.ai.nw:after{content:"";position:absolute;right:12px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.aic{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--bg);border:1px solid var(--bd)}
.aic.ci{background:var(--inb);color:var(--in);border-color:transparent}.aic.co{background:var(--outb);color:var(--out);border-color:transparent}
.ab{font-size:14px;padding-right:14px}.ab .m{color:var(--mut);font-size:12px;margin-top:2px}
.ht b{font-size:19px}.ht small{display:block;opacity:.85;font-size:12px}
.gh{background:rgba(255,255,255,.18);color:#fff;border:0}
.nav{display:flex;gap:6px;padding:0 10px 10px}
.nav button{flex:1;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:6px}
.nav button.on{background:#fff;color:#1565c0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 12px;background:var(--hb)}
.chip{border-radius:18px;white-space:nowrap;padding:6px 14px;background:#fff;color:#222;border:2px solid #fff}
.chip.on{background:transparent;color:#fff}
.ch,.er{display:grid;grid-template-columns:1fr 86px 86px;column-gap:4px;padding:6px 12px}
.ch{font-weight:600;font-size:14px;background:var(--bg)}.ch span+span{text-align:right}
.dh{background:var(--bg);padding:6px 12px;font-weight:600;font-size:14px;border-top:1px solid var(--bd)}
.er{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;cursor:pointer}
.el{grid-column:1;grid-row:1/3}.t{font-size:16px}.d{color:var(--mut);font-size:14px}.tm{color:var(--mut);font-size:13px;margin-top:4px}
.ei,.eo{font-weight:600;font-size:16px;text-align:right}.ei{grid-column:2;color:var(--in)}.eo{grid-column:3;color:var(--out)}
.eb{grid-column:2/4;grid-row:2;text-align:right;color:var(--mut);font-size:12px;align-self:end}
.fixb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.bbtn{display:flex;gap:10px}.bbtn button{flex:1;padding:12px;font-weight:600;border:0;border-radius:8px;color:#fff;background:var(--pri)}
.fixb .bbtn+.tot{margin-top:8px}.bbtn .gi{background:var(--g)}.bbtn .go{background:var(--r)}.bbtn .lt{background:var(--bg);color:var(--pri);border:1px solid var(--bd)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border:1px solid var(--bd);border-radius:6px}
.tot div{padding:6px;border-right:1px solid var(--bd)}.tot div:last-child{border:0}.tot small{display:block;font-size:12px}
.seg .pill{border-radius:20px;flex:none;padding:8px 18px}
.seg .pill.on.i{background:var(--g);color:#fff;border-color:var(--g)}.seg .pill.on.o{background:var(--r);color:#fff;border-color:var(--r)}
.dt{display:flex;align-items:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:10px}
.dt input{border:0;margin:0;background:transparent;flex:1;min-width:0}.dt button{border:0;background:transparent;font-size:20px;padding:4px 10px}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:10px}.fl{font-size:13px;margin-bottom:4px;display:block;font-weight:600}
:root{--cin:#12805c;--cout:#c2362b}

:root[data-theme="dark"]{--cin:#22a37a;--cout:#ef5f57}
.dfil{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.dfil select{margin:0}
.sgc{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.sgc button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--mut);white-space:nowrap}
.sgc button.on{background:var(--pri);color:#fff;font-weight:600}
.hero{border-radius:16px;padding:18px 18px 14px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#2196f3 0%,#1565c0 100%);box-shadow:0 6px 18px rgba(21,101,192,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1c5a99 0%,#123a66 100%);box-shadow:none}}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c5a99 0%,#123a66 100%);box-shadow:none}
.hero small{opacity:.85;font-size:13px}
.hv{font-size:clamp(34px,11vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.hn{font-size:13px;opacity:.9;margin-bottom:14px}.hn b{opacity:1}
.hp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hp>div{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.14);border-radius:12px;padding:10px}
.hp b{display:block;font-size:16px}.hp small{display:block;font-size:12px}
.hp .aic{width:30px;height:30px;font-size:15px;border:0}.hp .aic.ci{background:#e3f5ee;color:#12805c}.hp .aic.co{background:#fbe9e7;color:#c2362b}
.dl{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;margin-top:2px;background:rgba(255,255,255,.9);color:#374151}
.dl.g{color:#12805c}.dl.b{color:#c2362b}
.hc{font-size:11px;opacity:.75;margin-top:8px;text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:0}
.tile small{color:var(--mut);font-size:12px;display:block}.tile b{display:block;font-size:19px;margin:2px 0}
.tile span{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{border-radius:14px}.chd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.chd h2{margin:0 0 2px}.chd small{font-size:12px}
.cw{position:relative;width:100%;min-height:170px}.cw svg{display:block;overflow:visible;outline:none;touch-action:pan-y}
.cw svg:focus-visible{outline:2px solid var(--pri);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--bd);stroke-width:1}.gl.z{stroke:var(--mut);stroke-opacity:.45}
.ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--pri);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--pri);fill-opacity:.1}
.dot{fill:var(--pri);stroke:var(--card);stroke-width:2}
.xh{stroke:var(--mut);stroke-width:1}
.bi2{fill:var(--cin)}.bo2{fill:var(--cout)}.hbg{fill:var(--bg)}
.tip{display:none;position:absolute;top:-6px;transform:translateY(-100%);pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.14);white-space:nowrap;z-index:2}
.tip b{font-weight:600}.tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:-2px 0 8px}.lg b{color:var(--tx);font-weight:600}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{margin:0 0 12px}.hb:last-child{margin:0}
.hbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.hbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:8px;border-radius:4px;background:var(--bg)}.hbt i{display:block;height:100%;border-radius:4px;background:var(--cout)}
.urow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;padding:10px 0}
.urow:last-child{border:0}.un{flex:1;min-width:0}.un b,.un small{display:block}.ub{font-size:15px}
.av.sm{width:36px;height:36px;font-size:15px;background:var(--bg);color:var(--pri);border:1px solid var(--bd)}
.dt2 td{font-variant-numeric:tabular-nums}.nb{font-weight:600}.nb.g{color:var(--in)}.nb.b{color:var(--out)}
.more{width:100%;margin-top:10px;border:0;background:var(--bg);color:var(--pri);font-weight:600;padding:10px}
.uhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ul{padding:4px 14px}.ur{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.ur:last-child{border:0}
.ub.neg{color:var(--out)}.ib{width:38px;height:38px;flex:none;padding:0;border-radius:10px;background:var(--bg);font-size:16px;display:inline-flex;align-items:center;justify-content:center}
span.ib{background:transparent;border:0}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;z-index:21;background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.2);animation:sup .2s ease-out}
@keyframes sup{from{transform:translate(-50%,100%)}}
.hlogo{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.ht>div:first-child>div{display:flex;flex-direction:column}.ht>div:first-child{min-width:0}.ht b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
textarea{font:inherit;color:var(--tx);width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:10px;resize:vertical}
.lgo{display:flex;gap:14px;align-items:center;margin-bottom:16px}.lgp{width:84px;height:84px;flex:none;border-radius:16px;border:1px dashed var(--bd);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lgp img{width:100%;height:100%;object-fit:contain;background:#fff}.lgp span{font-size:32px;font-weight:700;color:var(--mut)}
.lgb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lgb small{flex-basis:100%}
.btn{display:inline-block;cursor:pointer;border:1px solid var(--bd);padding:9px 14px;border-radius:8px}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.ok{color:var(--in);font-size:13px;min-height:0}.ok:empty{display:none}.ok{margin-bottom:8px}

<script>
(function(){
var API=(window.CASHFLOW_API_URL||'').replace(/\/$/,'');
var app=document.getElementById('app'),users={},token=null,needsSetup=false,txs=[],me=null,tab='tx',range='7',period='all',q='',showQ=false,focusQ=false,form=null,ftype='all',fuser='all',ttype='in',err='',unsubs=[],inst=null,sheet=null,puser=null,parties=[],pseg='users',partyId=null,psheet=null,biz={},bizLogo=null,bizV=-1,bform=null,bdirty=false,exf='',ext='',exu='all',menu=false,menuAnim=false,activity=[],seenAt=0,prevSeen=0;
// Side menu items. To add a feature, add a line here and a view for its id in viewMain.
var MENU=[
  {id:'tx',icon:'📒',label:'Entries'},
  {id:'dash',icon:'📊',label:'Dashboard'},
  {id:'users',icon:'🔑',label:'Manage users',admin:true},
  {id:'export',icon:'📤',label:'Export PDF / Excel'},
  {id:'settings',icon:'⚙️',label:'Business settings',admin:true},
  {id:'deleted',icon:'🗑',label:'Deleted entries',admin:true},
  {id:'lang',icon:'🌐',label:'Language / भाषा'}
];
var fmt=function(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})};

var ymd=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var today=function(){return ymd(new Date())};
var sget=function(){try{return localStorage.getItem('cf_token')}catch(e){return null}};
var sset=function(v){try{v?localStorage.setItem('cf_token',v):localStorage.removeItem('cf_token')}catch(e){}};
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var hhmm=function(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

async function api(m,u,b){
  var h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  var r=await fetch(API+'/api'+u,{method:m,headers:h,body:b?JSON.stringify(b):undefined}),d=null;
  try{d=await r.json()}catch(e){}
  if(r.status===401&&token){signout();throw new Error('Session expired. Please sign in again.')}
  if(!r.ok){var er=new Error((d&&d.error)||'Request failed ('+r.status+')');er.status=r.status;throw er}
  return d;
}
function signout(){menu=false;puser=null;parties=[];partyId=null;psheet=null;pseg='users';fuser='all';tab='tx';sheet=null;bform=null;bdirty=false;biz={};bizLogo=null;bizV=-1;activity=[];seenAt=0;badge(0);document.body.style.overflow='';token=null;sset(null);me=null;users={};txs=[];form=null;err='';render()}
async function load(){var d=await api('GET','/data');me=d.me.name;users=d.users;txs=d.txs;activity=d.activity||[];seenAt=Math.max(seenAt,d.seenAt||0);
  parties=d.parties||[];biz=d.biz||{};if(biz.v!==bizV){bizLogo=null;if(biz.hasLogo){try{bizLogo=(await api('GET','/settings')).logo}catch(e){}}bizV=biz.v}}
async function reload(){await load();render()}
function instBtn(c){return inst?'<button class="'+c+'" id="inst">Install app</button>':''}
// Start-up: the free server sleeps when idle and takes up to a minute to wake, so keep retrying
// and keep the saved login. Only a 401 from the server (invalid session) signs the user out.
var sleepMs=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function waitScreen(title,sub,retry){
  app.innerHTML='<div class="card ctr" style="text-align:center"><div class="spin"'+(retry?' style="display:none"':'')+'></div><h2>'+esc(title)+'</h2><p class="mut">'+esc(sub)+'</p>'+(retry?'<button class="p" id="retry" style="width:100%">Retry</button>':'')+'</div>';
  tr(app);var b=document.getElementById('retry');if(b)b.onclick=boot;
}
async function boot(){
  var t0=Date.now(),slow=setTimeout(function(){waitScreen('Connecting…','The server is waking up. This can take up to a minute.')},1500);
  try{
    for(;;){
      try{needsSetup=(await api('GET','/bootstrap')).needsSetup;token=sget();if(token&&!needsSetup)await load();break}
      catch(e){
        if(e.status===401)break;
        if(Date.now()-t0>100000){waitScreen('Cannot reach server','Check your internet connection and try again. You are still signed in.',true);return}
        waitScreen('Connecting…','The server is waking up. This can take up to a minute.');await sleepMs(3000);
      }
    }
  }finally{clearTimeout(slow)}
  render();
}
async function init(){
  app.addEventListener('click',function(e){if(e.target.id!=='inst'||!inst)return;var p=inst;inst=null;p.prompt();if(menu){menu=false;history.back()}render();p.userChoice.finally(function(){refresh()})});
  app.addEventListener('input',function(e){var m={f_date:'date',f_time:'time',f_amt:'amount',f_notes:'notes',f_desc:'desc'}[e.target.id];if(form&&m)form[m]=e.target.value});
  await boot();
  setInterval(function(){if(!token||form||sheet||psheet)return;var a=document.activeElement;if(a&&a.tagName==='INPUT'&&app.contains(a))return;load().then(refresh).catch(function(){})},20000);
}

var HIM={Jan:'जन',Feb:'फ़र',Mar:'मार्च',Apr:'अप्रैल',May:'मई',Jun:'जून',Jul:'जुल',Aug:'अग',Sep:'सित',Oct:'अक्टू',Nov:'नव',Dec:'दिस'},HID={Sun:'रवि',Mon:'सोम',Tue:'मंगल',Wed:'बुध',Thu:'गुरु',Fri:'शुक्र',Sat:'शनि'};
// Dates are built with English month/day names (exports need them); on screen they are swapped here.
function trDate(t){return t.replace(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat), /,function(m,d){return HID[d]+', '}).replace(/(\b\d{1,2} )(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,function(m,a,b){return a+HIM[b]}).replace(/\b(AM|PM)\b/g,function(m){return m==='AM'?'सुबह':'शाम'})}
function trS(s){var k=s.trim();if(!k)return s;var v=HI[k];if(v==null){for(var i=0;i<HIP.length;i++){if(HIP[i][0].test(k)){v=k.replace(HIP[i][0],HIP[i][1]);break}}}
  if(v==null&&/\d{1,2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b|\d (AM|PM)\b/.test(k))v=trDate(k);else if(v!=null)v=trDate(v);
  return v==null?s:s.replace(k,v)}
function L(s){return lang==='hi'?trS(s):s}
function tr(root){
  if(lang!=='hi'||!root)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode&&n.parentNode.nodeName;return p==='SCRIPT'||p==='STYLE'||p==='OPTION'&&false?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(function(n){var v=trS(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(function(el){['placeholder','aria-label','title'].forEach(function(a){var v=el.getAttribute(a);if(v){var t=trS(v);if(t!==v)el.setAttribute(a,t)}})});
}

var fmtC=function(n){var a=Math.abs(n),s=n<0?'−':'',u=[[1e7,'Cr'],[1e5,'L'],[1e3,'K']];for(var i=0;i<u.length;i++)if(a>=u[i][0])return s+'₹'+(+(a/u[i][0]).toFixed(1))+u[i][1];return s+'₹'+Math.round(a)};
var sgn=function(n){return (n>0?'+':n<0?'−':'')+fmt(Math.abs(n))};
var niceMax=function(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
var dshort=function(k){var p=k.split('-');return p.length===2?MN[+p[1]-1]+' '+p[0].slice(2):String(+p[2]).padStart(2,'0')+' '+MN[+p[1]-1]};
var addDays=function(k,n){var d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
var spanDays=function(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)+1};

function dashData(base){
  var td=today(),mo=td.slice(0,7),z=function(){return {i:0,o:0,n:0}},A=z(),T=z(),M=z(),B=[],idx={};
  for(var k=addDays(td,-13);k<=td;k=addDays(k,1)){idx[k]=B.length;B.push({k:k,i:0,o:0,n:0})}
  var add=function(x,t){t.type==='in'?x.i+=t.amount:x.o+=t.amount;x.n++};
  base.forEach(function(t){var d=t.date||'';add(A,t);if(d===td)add(T,t);if(d.slice(0,7)===mo)add(M,t);if(idx[d]!=null)add(B[idx[d]],t)});
  return {A:A,T:T,M:M,B:B};
}

// Draw the 14-day chart at the current width, then wire hover/tap/keyboard.
function dashCharts(){
  var D=dash,cf=document.getElementById('c_flow');if(!D||!cf)return;
  var W=cf.clientWidth,H=170,L=46,R=10,T=14,Bm=24,pw=W-L-R,ph=H-T-Bm,n=D.B.length,s='';
  var mx=niceMax(D.B.reduce(function(m,b){return Math.max(m,b.i,b.o)},0)),yf=function(v){return T+ph-v/mx*ph},band=pw/n,bw=Math.max(1.5,Math.min(12,(band-2-Math.min(6,band*.3))/2));
  var xc=function(i){return L+band*(i+.5)};
  [0,mx/2,mx].forEach(function(v){s+='<line class="gl'+(v===0?' z':'')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+yf(v)+'" y2="'+yf(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(yf(v)+4)+'" text-anchor="end">'+fmtC(v)+'</text>'});
  s+='<rect class="hbg" style="display:none" y="'+T+'" height="'+ph+'" width="'+band+'"/>';
  var bar=function(cx,v,cls){if(!v)return '';var h0=Math.max(2,v/mx*ph),r=Math.min(4,bw/2,h0),x0=cx,y0=T+ph-h0;
    return '<path class="'+cls+'" d="M'+x0+','+(T+ph)+' V'+(y0+r)+' Q'+x0+','+y0+' '+(x0+r)+','+y0+' H'+(x0+bw-r)+' Q'+(x0+bw)+','+y0+' '+(x0+bw)+','+(y0+r)+' V'+(T+ph)+' Z"/>'};
  D.B.forEach(function(b,i){s+=bar(xc(i)-bw-1,b.i,'bi2')+bar(xc(i)+1,b.o,'bo2')});
  s+=xlabels(D.B,xc,H);
  cf.innerHTML='<svg width="'+W+'" height="'+H+'" tabindex="0" role="img" aria-label="Cash in versus cash out per day, last 14 days. Use arrow keys to read values.">'+s+'</svg><div class="tip"></div>';
  hover(cf,n,xc,function(i){var b=D.B[i],r=cf.querySelector('.hbg');r.style.display='';r.setAttribute('x',xc(i)-band/2);
    return '<b>'+dshort(b.k)+'</b><div><i class="k" style="background:var(--cin)"></i>In <b>'+fmt(b.i)+'</b></div><div><i class="k" style="background:var(--cout)"></i>Out <b>'+fmt(b.o)+'</b></div><div class="mut">Net '+sgn(b.i-b.o)+' · '+b.n+' entr'+(b.n===1?'y':'ies')+'</div>'},function(){cf.querySelector('.hbg').style.display='none'});
}
function xlabels(B,x,H){var n=B.length,ids=n<=1?[0]:n===2?[0,1]:[0,Math.floor((n-1)/2),n-1],s='';
  ids.forEach(function(i,j){s+='<text class="ax" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+(ids.length>1&&j===0?'start':j===ids.length-1&&ids.length>1?'end':'middle')+'">'+dshort(B[i].k)+'</text>'});return s}
// Nearest-bucket hover for pointer and touch; arrow keys step through buckets when the chart has focus.
function hover(box,n,x,show,hide){
  var svg=box.querySelector('svg'),tip=box.querySelector('.tip'),g=svg.querySelector('.hv'),cur=-1;
  var at=function(i){cur=i;if(g)g.style.display='';tip.innerHTML=show(i,g);tr(tip);tip.style.display='block';
    var tx=x(i),tw=tip.offsetWidth,bw=box.clientWidth;tip.style.left=Math.max(0,Math.min(bw-tw,tx-tw/2))+'px'};
  var off=function(){cur=-1;if(g)g.style.display='none';tip.style.display='none';hide&&hide()};
  var pick=function(e){var r=svg.getBoundingClientRect(),px=e.clientX-r.left,b=0,bd=1e9;for(var i=0;i<n;i++){var d=Math.abs(x(i)-px);if(d<bd){bd=d;b=i}}at(b)};
  svg.addEventListener('pointermove',pick);svg.addEventListener('pointerdown',pick);svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')off()});
  svg.addEventListener('focus',function(){if(cur<0&&svg.matches(':focus-visible'))at(n-1)});svg.addEventListener('blur',off);
  svg.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();at(Math.max(0,Math.min(n-1,(cur<0?n-1:cur)+(e.key==='ArrowLeft'?-1:1))))}else if(e.key==='Escape')off()});
}

var HF={kind:'Type',amount:'Amount',tx_date:'Date',tx_time:'Time',notes:'Notes',descr:'Description',party_id:'Party'},delList;
function histVal(f,v){

function histHtml(list){

    else if(s&&e.action==='add')h+='<div class="chg"><div><span>'+histVal('kind',s.kind)+'</span><p><b>'+fmt(s.amount)+'</b>'+(s.notes?' · '+esc(s.notes):'')+'</p></div></div>';

// Shrink the chosen image to at most 320px so it stays small; PNG keeps transparency, JPEG if PNG is too big.
function readLogo(file){return new Promise(function(ok,no){
  var r=new FileReader();r.onerror=function(){no(new Error('Could not read that file'))};
  r.onload=function(){var im=new Image();im.onerror=function(){no(new Error('That file is not an image'))};im.onload=function(){
    var k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);var d=c.toDataURL('image/png');
    if(d.length>380000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);d=c.toDataURL('image/jpeg',.85)}
    ok(d)};im.src=r.result};r.readAsDataURL(file)})}

  base.forEach(function(t){var v=t.type==='in'?t.amount:-t.amount;if(t.date<from){open+=v;return}if(t.date>to)return;
    t.type==='in'?ti+=t.amount:to2+=t.amount;rows.push({t:t,bal:0})});

// ---- People tab: Users (admin) and Parties ----
// Parties are private to the user who added them. A party's balance comes from that user's own
// cash entries linked to it: Cash Out to them = "you gave" (they owe you), Cash In = "you got".
var PK={customer:'Customer',supplier:'Supplier',staff:'Staff',other:'Other'};
// The admin also receives everyone's parties (read-only); only the owner can add, edit or delete one.
// A party's balance comes from its owner's cash entries linked to it.
function myParties(){return parties.filter(function(p){return p.owner===me})}
function partyTx(id){var p=parties.find(function(x){return x.id===id});return p?txs.filter(function(t){return t.party===id&&t.user===p.owner}):[]}
function pBal(id){return partyTx(id).reduce(function(s,t){return s+(t.type==='out'?t.amount:-t.amount)},0)}
function pName(id){var p=parties.find(function(x){return x.id===id});return p?p.name:''}
function balLabel(b){return b>0?'Will get':b<0?'Will give':'Settled'}
function peopleHtml(admin){
  if(partyId&&parties.some(function(p){return p.id===partyId}))return partyHtml();
  partyId=null;
  if(admin&&puser)return '<div class="pbar"><button class="sm" data-pub="1">← Users</button><span class="un"><b>'+esc(puser)+'\'s parties</b><small class="mut">View only</small></span></div>'+
    partiesHtml(parties.filter(function(p){return p.owner===puser}),'user');

// mode: 'mine' (your own, editable), 'user' (one user's, admin view), 'all' (everyone's, admin view)
function partiesHtml(list,mode){
  var get=0,give=0,ng=0,nv=0,rows=list.map(function(p){var b=pBal(p.id),last='';partyTx(p.id).forEach(function(t){if(t.date>last)last=t.date});if(b>0){get+=b;ng++}else if(b<0){give-=b;nv++}return {p:p,b:b,last:last}});

  if(list.length>4)h+='<input id="p_q" placeholder="🔍  Search party'+(mode==='all'?', phone or user':' name or phone')+'" autocomplete="off">';
  if(!rows.length)h+='<div class="card dempty"><b>No parties yet</b><p class="mut">'+(mode==='mine'?'Add customers, suppliers or staff to see how much each one owes you or you owe them. Only you can see your parties.':mode==='user'?esc(puser)+' has not added any parties.':'No one has added any parties yet.')+'</p></div>';
  else{h+='<div class="card ul">';rows.forEach(function(r){var p=r.p;
    h+='<button class="urow pr" data-pid="'+esc(p.id)+'" data-q="'+esc((p.name+' '+p.phone+' '+p.owner).toLowerCase())+'"><span class="av sm">'+esc(p.name.charAt(0).toUpperCase())+'</span><span class="un"><b>'+esc(p.name)+'<span class="tag">'+PK[p.kind]+'</span></b><small class="mut">'+(mode==='all'?'👤 '+esc(p.owner)+' · ':'')+(p.phone?esc(p.phone)+' · ':'')+(r.last?'last '+dshort(r.last):'no entries yet')+'</small></span><span class="r"><small>'+balLabel(r.b)+'</small><b class="'+(r.b>0?'in':r.b<0?'out':'')+'">'+fmt(Math.abs(r.b))+'</b></span></button>'});
    h+='</div>'}
  if(mode==='mine')h+='<button class="p" id="p_add" style="width:100%;margin-top:4px">+ Add party</button>';
  return h+partySheet();
}
function partyHtml(){
  var p=parties.find(function(x){return x.id===partyId}),ro=p.owner!==me,b=pBal(p.id),list=partyTx(p.id).slice().sort(cmp),run=0,rows=[];
  list.forEach(function(t){run+=t.type==='out'?t.amount:-t.amount;rows.push({t:t,bal:run})});rows.reverse();
  var you=ro?esc(p.owner):'you',You=ro?esc(p.owner):'You';
  var h='<div class="pbar"><button class="sm" data-pback="1">← Parties</button><span class="un"><b>'+esc(p.name)+'<span class="tag">'+PK[p.kind]+'</span></b><small class="mut">'+(p.phone?esc(p.phone):'')+(ro?(p.phone?' · ':'')+'👤 '+esc(p.owner)+'\'s party · view only':'')+'</small></span>'+(ro?'':'<button class="ib" id="p_edit" aria-label="Edit party">✎</button>')+'</div>';
  h+='<div class="pbal '+(b>0?'g':b<0?'b':'')+'"><small>'+(b>0?esc(p.name)+' owes '+you:b<0?You+' owe'+(ro?'s ':' ')+esc(p.name):'All settled with '+esc(p.name))+'</small><div class="hv">'+fmt(Math.abs(b))+'</div><div class="acts">'+
    (p.phone?'<a class="btn" href="tel:'+esc(p.phone.replace(/\s/g,''))+'">📞 Call</a>':'')+'<a class="btn" target="_blank" rel="noopener" href="'+waLink(p,b)+'">💬 WhatsApp</a>'+(!ro&&!list.length?'<button id="p_del">🗑 Delete</button>':'')+'</div></div>';
  h+='<div class="lh"><span>Entry</span><span class="out">'+You+' gave</span><span class="in">'+You+' got</span></div>';
  if(!rows.length)h+='<p class="mut pad">No entries yet.'+(ro?'':' Use the buttons below to record money you gave to or got from '+esc(p.name)+'.')+'</p>';
  rows.forEach(function(r){var t=r.t;
    h+='<div class="le" data-e="'+esc(t.id)+'"><div><div class="t">'+esc(nt(t)||(t.type==='out'?'Cash given':'Cash received'))+'</div><div class="m">'+dshort(t.date)+' '+t.date.slice(0,4)+(t.desc?' · '+esc(t.desc):'')+'</div></div><div class="o">'+(t.type==='out'?fn(t.amount):'')+'</div><div class="g">'+(t.type==='in'?fn(t.amount):'')+'</div><div class="bal2">'+(r.bal>0?'Will get ':r.bal<0?'Will give ':'Settled ')+fn(Math.abs(r.bal))+'</div></div>'});
  if(ro)return h;
  return h+'<div style="height:90px"></div><div class="fixb"><div class="bbtn"><button class="go" data-pnew="out">You gave ₹</button><button class="gi" data-pnew="in">You got ₹</button></div></div>'+partySheet();
}
function waLink(p,b){
  var bn=biz.name||'us',d=dlabel(today()).replace(/^\w+, /,''),msg='Hello '+p.name+',\n'+
    (b>0?'Your pending balance with *'+bn+'* is *₹'+fn(b)+'* as of '+d+'.\nPlease pay at your earliest. Thank you!':b<0?'*'+bn+'* has ₹'+fn(-b)+' payable to you as of '+d+'.\nThank you!':'Your account with *'+bn+'* is fully settled as of '+d+'. Thank you!')+(biz.name?'\n— '+biz.name:'');
  var ph=(p.phone||'').replace(/\D/g,'');if(ph.length===10)ph='91'+ph;
  return 'https://wa.me/'+(ph.length>=11?ph:'')+'?text='+encodeURIComponent(msg);
}
function partySheet(){
  if(!psheet)return '';var f=psheet;
  return '<div class="ov" data-psx></div><div class="sheet" role="dialog" aria-label="'+(f.id?'Edit party':'Add party')+'"><h2>'+(f.id?'Edit party':'Add party')+'</h2>'+
    '<input id="pp_n" placeholder="Name" value="'+esc(f.name)+'" autocomplete="off"><input id="pp_p" type="tel" inputmode="tel" placeholder="Phone (optional, for WhatsApp)" value="'+esc(f.phone)+'">'+
    '<select id="pp_k">'+Object.keys(PK).map(function(k){return '<option value="'+k+'"'+(f.kind===k?' selected':'')+'>'+PK[k]+'</option>'}).join('')+'</select>'+
    '<div class="err" id="e">'+esc(err)+'</div><div class="bbtn"><button class="lt" data-psx>Cancel</button><button id="pp_save">'+(f.id?'Save':'Add party')+'</button></div></div>';
}
function bindPeople(){
  var G=function(i){return document.getElementById(i)},$=function(x){return app.querySelectorAll(x)};
  $('[data-ps]').forEach(function(b){b.onclick=function(){pseg=b.dataset.ps;render()}});
  $('[data-pid]').forEach(function(b){b.onclick=function(){partyId=b.dataset.pid;render();window.scrollTo(0,0)}});
  $('[data-pback]').forEach(function(b){b.onclick=function(){partyId=null;render()}});
  $('[data-pu]').forEach(function(b){b.onclick=function(){puser=b.dataset.pu;partyId=null;render();window.scrollTo(0,0)}});
  $('[data-pub]').forEach(function(b){b.onclick=function(){puser=null;render()}});
  if(G('p_q'))G('p_q').oninput=function(e){var q=e.target.value.trim().toLowerCase();$('[data-pid]').forEach(function(r){r.style.display=!q||r.dataset.q.indexOf(q)>=0?'':'none'})};
  if(G('p_add'))G('p_add').onclick=function(){psheet={name:'',phone:'',kind:'customer'};err='';render();G('pp_n').focus()};

  if(G('p_del'))G('p_del').onclick=async function(){var p=parties.find(function(x){return x.id===partyId});if(!confirm(L('Delete party "'+p.name+'"?')))return;try{await api('DELETE','/parties/'+p.id);partyId=null;await load();render()}catch(e){alert(e.message)}};
  $('[data-psx]').forEach(function(b){b.onclick=function(){psheet=null;err='';render()}});
  if(G('pp_n')){['pp_n','pp_p','pp_k'].forEach(function(i){G(i).oninput=G(i).onchange=function(){psheet.name=G('pp_n').value;psheet.phone=G('pp_p').value;psheet.kind=G('pp_k').value}});
    G('pp_p').onkeydown=function(e){if(e.key==='Enter')G('pp_save').click()}}
  if(G('pp_save'))G('pp_save').onclick=async function(){var f=psheet;if(!f.name.trim())return seterr('Enter a name');
    try{var r=f.id?await api('PUT','/parties/'+f.id,f):await api('POST','/parties',f);psheet=null;err='';partyId=r.id;await load();render();window.scrollTo(0,0)}catch(e){seterr(e.message)}};
  $('[data-pnew]').forEach(function(b){b.onclick=function(){form=newForm(b.dataset.pnew);form.party=partyId;err='';render()}});
}
// Party picker on the Cash In / Cash Out form: only your own parties, only in your own cashbook.
function partyPicker(f){
  if(f.user&&f.user!==me)return '';
  var mine=myParties();if(!mine.length)return '<p class="note">Tip: add customers and suppliers under <b>'+(users[me]&&users[me].role==='admin'?'People → My parties':'Parties')+'</b> to track what each one owes.</p>';
  var h='<label class="fl" for="f_party">Party (optional)</label><select id="f_party"><option value="">No party</option>'+mine.map(function(p){return '<option value="'+esc(p.id)+'"'+(f.party===p.id?' selected':'')+'>'+esc(p.name)+' · '+PK[p.kind]+'</option>'}).join('')+'</select>';
  if(f.party&&pName(f.party))h+='<p class="note" id="f_pnote" style="margin:-4px 0 10px">'+partyNote(f)+'</p>';
  return h;
}
function actTextHi(a){
  var who=a.actor===me?'आपने':'<b>'+esc(a.actor)+'</b> ने',ty=a.type==='in'?'नकद आया':'नकद गया',amt=a.amount!=null?' '+fmt(a.amount):'';
  var book=a.owner===a.actor?'':a.owner===me?' (आपकी कैशबुक में)':' (<b>'+esc(a.owner)+'</b> की कैशबुक में)';
  switch(a.action){
    case 'tx_add':return who+' '+ty+amt+' जोड़ा'+book;
    case 'tx_edit':return who+' '+ty+' एंट्री बदली'+(a.prev!=null&&a.prev!==a.amount?' '+fmt(a.prev)+' → '+fmt(a.amount):amt)+book;
    case 'tx_delete':return who+' '+ty+amt+' हटाया'+book;
    case 'tx_restore':return who+' '+ty+amt+' वापस लाया'+book;
    case 'user_add':return a.owner===me?who+' आपका खाता बनाया':who+' यूज़र <b>'+esc(a.owner)+'</b> बनाया';
    case 'user_password':return a.owner===me?who+' आपका पासवर्ड बदला':who+' <b>'+esc(a.owner)+'</b> का पासवर्ड बदला';
    case 'user_delete':return who+' यूज़र <b>'+esc(a.owner)+'</b> हटाया';
    case 'settings':return who+' बिज़नेस सेटिंग्स बदलीं';
  }
  return who+' बदलाव किया';
}
function partyNote(f){
  var cur=pBal(f.party),old=f.id?(txs.find(function(t){return t.id===f.id&&t.party===f.party})||null):null;
  if(old)cur-=old.type==='out'?old.amount:-old.amount;var a=parseFloat(f.amount)||0,nb=cur+(f.type==='out'?a:-a);
  if(lang==='hi'){var lh=function(v){return v>0?'से लेना है '+fmt(v):v<0?'को देना है '+fmt(-v):'हिसाब बराबर'};
    return esc(pName(f.party))+' '+lh(cur)+(a?' → इसके बाद <b>'+lh(nb)+'</b>':'')}
  var lb=function(v){return v>0?'owes you '+fmt(v):v<0?'you owe '+fmt(-v):'settled'};
  return esc(pName(f.party))+' '+lb(cur)+(a?' → after this <b>'+lb(nb)+'</b>':'');
}

// Users tab (admin): every cashbook with its balance; tapping one opens it in Entries with a back button.
function booksHtml(){
  var names={},tot=0;Object.keys(users).forEach(function(k){names[k]=1});txs.forEach(function(t){names[t.user]=1});
  var rows=Object.keys(names).map(function(k){var b=0,n=0,last='';txs.forEach(function(t){if(t.user===k){n++;b+=t.type==='in'?t.amount:-t.amount;if(t.date>last)last=t.date}});tot+=b;return {k:k,b:b,n:n,last:last}})
    .sort(function(a,b){return (users[b.k]?1:0)-(users[a.k]?1:0)||a.k.localeCompare(b.k)});
  var h='<div class="uhd"><div><h2 style="margin:0">Cashbooks</h2><small class="mut">'+rows.length+' users · tap one to open</small></div><div style="text-align:right"><small class="mut">Total balance</small><div><b>'+sgnb(tot)+'</b></div></div></div><div class="card ul">';
  rows.forEach(function(r){var pc=parties.filter(function(p){return p.owner===r.k}).length;
    h+='<div class="urw"><button class="urow" data-vu="'+esc(r.k)+'"><span class="av sm">'+esc(r.k.charAt(0).toUpperCase())+'</span><span class="un"><b>'+esc(r.k)+(users[r.k]?'':' <small class="mut">(removed)</small>')+'</b><small class="mut">'+r.n+' entr'+(r.n===1?'y':'ies')+(r.last?' · last '+dshort(r.last):'')+'</small></span><b class="ub'+(r.b<0?' neg':'')+'">'+sgnb(r.b)+'</b><span class="chev">›</span></button>'+
      (pc?'<button class="pcnt" data-pu="'+esc(r.k)+'">👤 '+pc+' part'+(pc===1?'y':'ies')+' ›</button>':'')+'</div>'});
  return h+'</div>';
}

// Users screen (admin, opened from the side menu): names with balances, add / change password / delete.
// Add and change-password use a small bottom sheet; sheet = {mode:'add'} or {mode:'pw',user:name}.
function usersHtml(){
  var h='<div class="uhd"><div><h2 style="margin:0">Users</h2><small class="mut">'+Object.keys(users).length+' logins · all-time balance</small></div><button class="p" id="u_add">+ Add user</button></div><div class="card ul">';
  Object.keys(users).sort(function(a,b){return (users[b].role==='admin')-(users[a].role==='admin')||a.localeCompare(b)}).forEach(function(k){
    var u=users[k],bal=0;txs.forEach(function(t){if(t.user===k)bal+=t.type==='in'?t.amount:-t.amount});
    h+='<div class="ur"><span class="av sm">'+esc(k.charAt(0).toUpperCase())+'</span><div class="un"><b>'+esc(k)+'</b><small class="mut">'+(u.role==='admin'?'Admin (you)':'User')+'</small></div>'+
      '<b class="ub'+(bal<0?' neg':'')+'">'+(bal<0?'−':'')+fmt(Math.abs(bal))+'</b>'+

  });
  h+='</div>';

    h+='<div class="ov" data-sx></div><div class="sheet" role="dialog" aria-label="'+(add?'Add user':'Change password')+'"><h2>'+(add?'Add user':'Change password')+'</h2>'+
      (add?'<input id="nu_n" placeholder="Username" autocapitalize="none" autocomplete="off">':'<p class="mut" style="margin:-6px 0 12px">For <b>'+esc(sheet.user)+'</b></p>')+

      '<div class="err" id="e">'+esc(err)+'</div><div class="bbtn"><button class="lt" data-sx>Cancel</button><button id="u_save">'+(add?'Create user':'Save password')+'</button></div></div>';

function bind(admin){
  var $=function(x){return app.querySelectorAll(x)},G=function(i){return document.getElementById(i)};
  G('out')&&(G('out').onclick=function(){closeMenu();signout()});
  G('menu').onclick=function(){openMenu('menu')};
  G('bell').onclick=openNotif;
  $('[data-close]').forEach(function(b){b.onclick=closeMenu});
  $('[data-m]').forEach(function(b){b.onclick=function(){if(tab==='settings'&&bdirty&&b.dataset.m!=='settings'&&!confirm(L('Discard unsaved settings?')))return;if(b.dataset.m==='deleted')delList=undefined;tab=b.dataset.m;err='';sheet=null;bform=null;bdirty=false;closeMenu();window.scrollTo(0,0)}});
  $('[data-t]').forEach(function(b){b.onclick=function(){if(b.dataset.t==='books'){partyId=null;puser=null}tab=b.dataset.t;err='';render()}});
  $('[data-p]').forEach(function(b){b.onclick=function(){period=b.dataset.p;render()}});
  if(G('sbtn'))G('sbtn').onclick=function(){showQ=!showQ;if(!showQ)q='';focusQ=showQ;render()};
  if(G('q'))G('q').oninput=function(e){q=e.target.value;focusQ=true;render()};
  if(G('e_user'))G('e_user').onchange=function(e){fuser=e.target.value;render()};
  if(G('d_user'))G('d_user').onchange=function(e){fuser=e.target.value;render()};
  if(G('d_range'))G('d_range').onchange=function(e){range=e.target.value;sumAll=false;render()};
  if(G('sum_more'))G('sum_more').onclick=function(){sumAll=!sumAll;render()};
  $('[data-lang]').forEach(function(b){b.onclick=function(){setLang(b.dataset.lang)}});
  if(tab==='books')bindPeople();
  if(tab==='deleted')bindDeleted();
  if(tab==='dash')dashCharts();
  bindSettings();bindExport(admin);
  $('[data-vu]').forEach(function(b){b.onclick=function(){fuser=b.dataset.vu;tab='tx';period='all';render();window.scrollTo(0,0)}});
  $('[data-new]').forEach(function(b){b.onclick=function(){form=newForm(b.dataset.new);if(admin&&fuser!=='all')form.user=fuser;err='';render()}});
  $('[data-e]').forEach(function(r){r.onclick=function(){var t=txs.find(function(x){return x.id===r.dataset.e});if(t){form={id:t.id,user:t.user,ts:t.ts,type:t.type,date:t.date,time:tm(t),amount:String(t.amount),notes:nt(t),desc:t.desc||'',party:t.party||null};err='';render()}}});
  if(G('u_add'))G('u_add').onclick=function(){sheet={mode:'add'};err='';render();G('nu_n').focus()};
  $('[data-rp]').forEach(function(b){b.onclick=function(){sheet={mode:'pw',user:b.dataset.rp};err='';render();G('nu_p').focus()}});
  $('[data-sx]').forEach(function(b){b.onclick=function(){sheet=null;err='';render()}});
  if(G('nu_p'))G('nu_p').onkeydown=function(e){if(e.key==='Enter')G('u_save').click()};
  if(G('u_save'))G('u_save').onclick=async function(){
    var p=G('nu_p').value,add=sheet.mode==='add',n=add?uname(G('nu_n').value):sheet.user;
    if(!n)return seterr('Enter a username');if(p.length<6)return seterr('Password must be at least 6 characters');
    try{if(add)await api('POST','/users',{username:n,password:p});else await api('PUT','/users/'+encodeURIComponent(n)+'/password',{password:p});sheet=null;err='';await reload()}catch(e){seterr(e.message)}
  };
  $('[data-du]').forEach(function(b){b.onclick=async function(){var k=b.dataset.du;if(confirm(L('Delete user "'+k+'"? They can no longer sign in. Their entries are kept.'))){try{await api('DELETE','/users/'+encodeURIComponent(k));if(fuser===k)fuser='all';await reload()}catch(e){alert(e.message)}}}});
}

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();inst=e;refresh()});
var rsz;window.addEventListener('resize',function(){clearTimeout(rsz);rsz=setTimeout(function(){if(tab==='dash'&&me&&!form)dashCharts()},150)});

if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

init();
})();
