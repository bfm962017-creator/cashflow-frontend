<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2196f3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cashflow">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--pri:#2457d6;--in:#12805c;--out:#c2362b;--inb:#e3f5ee;--outb:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2228;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b;--pri:#6c93f5;--in:#4cc9a0;--out:#ff8a7d;--inb:#14332a;--outb:#3a1f1c}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2228;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b;--pri:#6c93f5;--in:#4cc9a0;--out:#ff8a7d;--inb:#14332a;--outb:#3a1f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:10px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);padding:9px 14px;border-radius:8px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.top .who{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:12px;padding:12px;border:1px solid var(--bd);background:var(--card)}
.stat small{color:var(--mut);display:block}.stat b{font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1}
.seg button.on.i{background:var(--inb);border-color:var(--in);color:var(--in)}
.seg button.on.o{background:var(--outb);border-color:var(--out);color:var(--out)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}.tx .n{font-weight:500}.tx .m{color:var(--mut);font-size:12px}
.tx .a{text-align:right;white-space:nowrap}
.err{color:var(--out);font-size:13px;min-height:18px}
.mut{color:var(--mut)}
.ctr{max-width:380px;margin:8vh auto 0}
.scroll{overflow-x:auto}
.chart{display:flex;gap:4px;height:130px}.bc{flex:1;display:flex;flex-direction:column;align-items:center}
.bb{flex:1;display:flex;align-items:flex-end;gap:1px;width:100%}.bb i{flex:1;display:block;min-height:1px;border-radius:2px 2px 0 0}
.bi{background:var(--in)}.bo{background:var(--out)}.bc small{font-size:10px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.leg{font-size:12px;color:var(--mut);margin-top:6px}.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

:root{--hb:#2196f3;--g:#43a047;--r:#e53935}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hb:#1c4f86}}
:root[data-theme="dark"]{--hb:#1c4f86}
.wrap{max-width:640px;padding:0}.wrap>.ctr{width:calc(100% - 24px)}
.pad{padding:12px}.tx-pg{padding-bottom:160px}
.hdr{background:var(--hb);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ht{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.mbtn{font-size:22px;line-height:1;padding:4px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drw{position:fixed;top:0;bottom:0;left:0;width:min(290px,82vw);background:var(--card);z-index:21;display:flex;flex-direction:column;overflow-y:auto;box-shadow:2px 0 16px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.drw.an{animation:dslide .2s ease-out}.ov.an{animation:dfade .2s}
@keyframes dslide{from{transform:translateX(-100%)}}@keyframes dfade{from{opacity:0}}
.dhd{background:var(--hb);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;gap:12px;align-items:center}
.dhd b{display:block;font-size:16px}.dhd small{opacity:.85;font-size:12px}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;color:#1565c0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.dsec{padding:12px 16px 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:12px 16px;font-size:15px}
.mi.on{background:var(--bg);color:var(--pri);font-weight:600}.mi span{width:22px;text-align:center}
.dft{margin-top:auto;border-top:1px solid var(--bd)}
.ht b{font-size:19px}.ht small{display:block;opacity:.85;font-size:12px}
.gh{background:rgba(255,255,255,.18);color:#fff;border:0}
.nav{display:flex;gap:6px;padding:0 10px 10px}
.nav button{flex:1;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:6px}
.nav button.on{background:#fff;color:#1565c0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 12px;background:var(--hb)}
.chip{border-radius:18px;white-space:nowrap;padding:6px 14px;background:#fff;color:#222;border:2px solid #fff}
.chip.on{background:transparent;color:#fff}
.ch,.er{display:grid;grid-template-columns:1fr 86px 86px;column-gap:4px;padding:6px 12px}
.ch{font-weight:600;font-size:14px;background:var(--bg)}.ch span+span{text-align:right}
.dh{background:var(--bg);padding:6px 12px;font-weight:600;font-size:14px;border-top:1px solid var(--bd)}
.er{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;cursor:pointer}
.el{grid-column:1;grid-row:1/3}.t{font-size:16px}.d{color:var(--mut);font-size:14px}.tm{color:var(--mut);font-size:13px;margin-top:4px}
.ei,.eo{font-weight:600;font-size:16px;text-align:right}.ei{grid-column:2;color:var(--in)}.eo{grid-column:3;color:var(--out)}
.eb{grid-column:2/4;grid-row:2;text-align:right;color:var(--mut);font-size:12px;align-self:end}
.fixb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.bbtn{display:flex;gap:10px}.bbtn button{flex:1;padding:12px;font-weight:600;border:0;border-radius:8px;color:#fff;background:var(--pri)}
.fixb .bbtn+.tot{margin-top:8px}.bbtn .gi{background:var(--g)}.bbtn .go{background:var(--r)}.bbtn .lt{background:var(--bg);color:var(--pri);border:1px solid var(--bd)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border:1px solid var(--bd);border-radius:6px}
.tot div{padding:6px;border-right:1px solid var(--bd)}.tot div:last-child{border:0}.tot small{display:block;font-size:12px}
.seg .pill{border-radius:20px;flex:none;padding:8px 18px}
.seg .pill.on.i{background:var(--g);color:#fff;border-color:var(--g)}.seg .pill.on.o{background:var(--r);color:#fff;border-color:var(--r)}
.dt{display:flex;align-items:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:10px}
.dt input{border:0;margin:0;background:transparent;flex:1;min-width:0}.dt button{border:0;background:transparent;font-size:20px;padding:4px 10px}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:10px}.fl{font-size:13px;margin-bottom:4px;display:block;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mut">Loading…</p></div>
<script src="config.js"></script>
<script>
(function(){
var API=(window.CASHFLOW_API_URL||'').replace(/\/$/,'');
var app=document.getElementById('app'),users={},token=null,needsSetup=false,txs=[],me=null,tab='tx',range='14',period='all',q='',showQ=false,focusQ=false,form=null,ftype='all',fuser='all',ttype='in',err='',unsubs=[],inst=null,menu=false,menuAnim=false;
// Side menu items. To add a feature, add a line here and a view for its id in viewMain.
var MENU=[
  {id:'tx',icon:'📒',label:'Entries'},
  {id:'dash',icon:'📊',label:'Dashboard'},
  {id:'users',icon:'👥',label:'Users',admin:true}
];
var fmt=function(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})};
var esc=function(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML.replace(/"/g,'&quot;')};
var ymd=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var today=function(){return ymd(new Date())};
var sget=function(){try{return localStorage.getItem('cf_token')}catch(e){return null}};
var sset=function(v){try{v?localStorage.setItem('cf_token',v):localStorage.removeItem('cf_token')}catch(e){}};
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var dlabel=function(x){var d=new Date(x+'T00:00:00');return DN[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+' '+MN[d.getMonth()]+' '+d.getFullYear()};
var hhmm=function(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
var t12=function(x){if(!x)return '';var p=x.split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+p[1]+' '+ap};
var nt=function(t){return t.notes!=null?t.notes:(t.note||'')};
var tm=function(t){return t.time||(t.ts?hhmm(new Date(t.ts)):'')};
var fn=function(n){return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
var cmp=function(a,b){return (a.date||'').localeCompare(b.date||'')||tm(a).localeCompare(tm(b))||(a.ts||0)-(b.ts||0)};
var newForm=function(ty){return {type:ty,date:today(),time:hhmm(new Date()),amount:'',notes:'',desc:''}};
var refresh=function(){if(form)return;var a=document.activeElement;if(a&&a.tagName==='INPUT'&&app.contains(a))return;render()};
var rid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var uname=function(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'')};

async function api(m,u,b){
  var h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  var r=await fetch(API+'/api'+u,{method:m,headers:h,body:b?JSON.stringify(b):undefined}),d=null;
  try{d=await r.json()}catch(e){}
  if(r.status===401&&token){signout();throw new Error('Session expired. Please sign in again.')}
  if(!r.ok)throw new Error((d&&d.error)||'Request failed ('+r.status+')');
  return d;
}
function signout(){menu=false;document.body.style.overflow='';token=null;sset(null);me=null;users={};txs=[];form=null;err='';render()}
async function load(){var d=await api('GET','/data');me=d.me.name;users=d.users;txs=d.txs}
async function reload(){await load();render()}
function instBtn(c){return inst?'<button class="'+c+'" id="inst">Install app</button>':''}
async function init(){
  app.addEventListener('click',function(e){if(e.target.id!=='inst'||!inst)return;var p=inst;inst=null;p.prompt();if(menu){menu=false;history.back()}render();p.userChoice.finally(function(){refresh()})});
  app.addEventListener('input',function(e){var m={f_date:'date',f_time:'time',f_amt:'amount',f_notes:'notes',f_desc:'desc'}[e.target.id];if(form&&m)form[m]=e.target.value});
  try{needsSetup=(await api('GET','/bootstrap')).needsSetup}catch(e){app.innerHTML='<div class="card ctr"><h2>Cannot reach server</h2><p class="err">'+esc(e.message)+'</p></div>';return}
  token=sget();
  if(token&&!needsSetup){try{await load()}catch(e){token=null;sset(null)}}
  render();
  setInterval(function(){if(!token||form)return;var a=document.activeElement;if(a&&a.tagName==='INPUT'&&app.contains(a))return;load().then(function(){if(!form)render()}).catch(function(){})},20000);
}

function render(){
  if(needsSetup)return viewSetup();
  if(!me)return viewLogin();
  if(form)return viewForm();
  viewMain();
}

function viewSetup(){
  app.innerHTML='<div class="card ctr"><h1>Cashflow setup</h1><p class="mut">Create the admin account. You will use it to add other users.</p>'+
  '<input id="s_n" placeholder="Admin username" autocapitalize="none"><input id="s_p" type="password" placeholder="Password (min 6 chars)"><input id="s_p2" type="password" placeholder="Confirm password">'+
  '<div class="err" id="e">'+esc(err)+'</div><button class="p" id="go" style="width:100%">Create admin</button></div>';
  document.getElementById('go').onclick=async function(){
    var n=uname(document.getElementById('s_n').value),p=document.getElementById('s_p').value,p2=document.getElementById('s_p2').value;
    if(!n)return seterr('Enter a username');if(p.length<6)return seterr('Password must be at least 6 characters');if(p!==p2)return seterr('Passwords do not match');
    try{var r=await api('POST','/setup',{username:n,password:p});token=r.token;sset(token);needsSetup=false;err='';await load();tab='tx';render()}catch(e){seterr(e.message)}
  };
}
function seterr(m){err=m;var e=document.getElementById('e');if(e)e.textContent=m}

function viewLogin(){
  app.innerHTML='<div class="card ctr"><h1>Cashflow</h1><p class="mut">Sign in to continue</p>'+
  '<input id="l_n" placeholder="Username" autocapitalize="none"><input id="l_p" type="password" placeholder="Password">'+
  '<div class="err" id="e">'+esc(err)+'</div><button class="p" id="go" style="width:100%">Sign in</button>'+(inst?'<div style="margin-top:10px">'+instBtn('')+'</div>':'')+'</div>';
  var go=async function(){
    var n=uname(document.getElementById('l_n').value),p=document.getElementById('l_p').value;
    try{var r=await api('POST','/login',{username:n,password:p});token=r.token;sset(token);err='';await load();tab='tx';render()}catch(e){seterr(e.message)}
  };
  document.getElementById('go').onclick=go;
  document.getElementById('l_p').onkeydown=function(e){if(e.key==='Enter')go()};
}

function viewMain(){
  var u=users[me],admin=u.role==='admin';
  var tabs=[['tx','Entries'],['dash','Dashboard']];if(admin)tabs.push(['users','Users']);
  var h='<div class="hdr"><div class="ht"><div style="display:flex;gap:10px;align-items:center"><button class="gh mbtn" id="menu" aria-label="Menu">☰</button><div><b>Cashflow</b><small>'+esc(me)+' · '+(admin?'Admin':'User')+'</small></div></div></div><div class="nav">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div></div>';
  h+=tab==='tx'?'<div class="tx-pg">'+txHtml(admin)+'</div>':'<div class="pad">'+(tab==='dash'?dashHtml(admin):usersHtml())+'</div>';
  if(menu)h+=menuHtml(admin);
  document.body.style.overflow=menu?'hidden':'';
  app.innerHTML=h;
  bind(admin);
  if(tab==='tx'&&showQ&&focusQ){var qi=document.getElementById('q');if(qi){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}
}

function menuHtml(admin){
  var an=menuAnim?' an':'';menuAnim=false;
  var h='<div class="ov'+an+'" data-close></div><nav class="drw'+an+'" aria-label="Menu"><div class="dhd"><div class="av">'+esc((me||'?').charAt(0).toUpperCase())+'</div><div><b>'+esc(me)+'</b><small>'+(admin?'Admin':'User')+'</small></div></div><div class="dsec">Menu</div>';
  MENU.forEach(function(m){if(m.admin&&!admin)return;h+='<button class="mi'+(tab===m.id?' on':'')+'" data-m="'+m.id+'"><span>'+m.icon+'</span>'+esc(m.label)+'</button>'});
  return h+'<div class="dft">'+(inst?'<button class="mi" id="inst"><span>📲</span>Install app</button>':'')+'<button class="mi" id="out"><span>🚪</span>Sign out</button></div></nav>';
}
// The open menu holds a history entry so the phone's back button closes it.
function openMenu(){menu=true;menuAnim=true;history.pushState({menu:1},'');render()}
function closeMenu(){if(menu){menu=false;history.back();render()}}

function viewForm(){
  var f=form,isIn=f.type==='in';
  var h='<div class="hdr"><div class="ht"><div style="display:flex;gap:10px;align-items:center"><button class="gh" id="fb">←</button><b>'+(f.id?'Edit entry':(isIn?'Cash In':'Cash Out'))+'</b></div>'+(f.id?'<button class="gh" id="fdel">Delete</button>':'')+'</div></div>';
  h+='<div class="pad" style="padding-bottom:100px"><div class="card"><div class="seg"><button class="pill i '+(isIn?'on':'')+'" data-ty="in">Cash In</button><button class="pill o '+(!isIn?'on':'')+'" data-ty="out">Cash Out</button></div>'+
  '<div class="row2"><div class="dt"><button data-dd="-1">‹</button><input id="f_date" type="date" value="'+esc(f.date)+'"><button data-dd="1">›</button></div><div class="dt"><input id="f_time" type="time" value="'+esc(f.time)+'"></div></div>'+
  '<label class="fl '+(isIn?'in':'out')+'">'+(isIn?'Cash In':'Cash Out')+' amount (₹)</label><input id="f_amt" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(f.amount)+'">'+
  '<input id="f_notes" placeholder="Notes (name / party)" value="'+esc(f.notes)+'"><input id="f_desc" placeholder="Description / Category" value="'+esc(f.desc)+'">'+
  (f.user&&f.user!==me?'<div class="mut" style="margin-bottom:8px">Entry for user: <b>'+esc(f.user)+'</b></div>':'')+'<div class="err" id="e">'+esc(err)+'</div></div></div>'+
  '<div class="fixb"><div class="bbtn"><button class="lt" id="sx">Save and exit</button><button id="sc">'+(f.id?'Update':'Save and continue')+'</button></div></div>';
  app.innerHTML=h;
  var G=function(i){return document.getElementById(i)};
  G('fb').onclick=function(){form=null;err='';render()};
  app.querySelectorAll('[data-ty]').forEach(function(b){b.onclick=function(){form.type=b.dataset.ty;render()}});
  app.querySelectorAll('[data-dd]').forEach(function(b){b.onclick=function(){var d=new Date((form.date||today())+'T00:00:00');d.setDate(d.getDate()+parseInt(b.dataset.dd));form.date=ymd(d);render()}});
  if(G('fdel'))G('fdel').onclick=async function(){if(confirm('Delete this entry?')){try{await api('DELETE','/tx/'+form.id);await load();form=null;render()}catch(e){seterr(e.message)}}};
  G('sx').onclick=function(){save(true)};G('sc').onclick=function(){save(false)};
  if(!f.id&&!f.amount)G('f_amt').focus();
}
async function save(exit){
  var f=form,amt=parseFloat(f.amount);
  if(!(amt>0))return seterr('Enter a valid amount');if(!f.date)return seterr('Pick a date');
  var data={type:f.type,amount:Math.round(amt*100)/100,date:f.date,time:f.time||'',notes:f.notes.trim(),desc:f.desc.trim(),user:f.user||undefined};
  try{if(f.id)await api('PUT','/tx/'+f.id,data);else await api('POST','/tx',data);await load()}catch(e){return seterr(e.message)}
  err='';
  if(exit||f.id){form=null}else{var d=f.date,uu=f.user;form=newForm(f.type);form.date=d;if(uu)form.user=uu}
  render();
}

function dashHtml(admin){
  var base=txs.filter(function(t){return admin?(fuser==='all'||t.user===fuser):t.user===me});
  var sum=function(a){var i=0,o=0;a.forEach(function(t){t.type==='in'?i+=t.amount:o+=t.amount});return{i:i,o:o,n:a.length}};
  var td=today(),mo=td.slice(0,7);
  var all=sum(base),dy=sum(base.filter(function(t){return t.date===td})),mn=sum(base.filter(function(t){return (t.date||'').slice(0,7)===mo}));
  var card=function(label,x,bal){return '<div class="card" style="margin:0"><small class="mut">'+label+'</small><div class="in"><b>+'+fmt(x.i)+'</b></div><div class="out"><b>−'+fmt(x.o)+'</b></div><div class="m mut">Net '+fmt(x.i-x.o)+' · '+x.n+' entries</div></div>'};
  var h='';
  if(admin){h+='<div class="row" style="margin-bottom:12px"><select id="d_user" style="margin:0"><option value="all">All users</option>'+Object.keys(users).sort().map(function(k){return '<option'+(fuser===k?' selected':'')+'>'+esc(k)+'</option>'}).join('')+'</select></div>'}
  h+='<div class="stats"><div class="stat"><small>Total balance</small><b>'+fmt(all.i-all.o)+'</b></div><div class="stat"><small>Total in</small><b class="in">'+fmt(all.i)+'</b></div><div class="stat"><small>Total out</small><b class="out">'+fmt(all.o)+'</b></div></div>';
  h+='<div class="grid2">'+card('Today',dy)+card('This month',mn)+'</div>';
  // chart: last 14 days
  var arr=[],mx=1;
  for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=ymd(d);var x=sum(base.filter(function(t){return t.date===k}));arr.push({k:k,x:x});mx=Math.max(mx,x.i,x.o)}
  h+='<div class="card"><h2>Last 14 days</h2><div class="chart">'+arr.map(function(a){return '<div class="bc"><div class="bb"><i class="bi" style="height:'+(a.x.i/mx*100)+'%"></i><i class="bo" style="height:'+(a.x.o/mx*100)+'%"></i></div><small>'+a.k.slice(8)+'</small></div>'}).join('')+'</div><div class="leg"><b style="background:var(--in)"></b>In<b style="background:var(--out)"></b>Out</div></div>';
  // daily summary
  var cut=null;if(range!=='all'){var c=new Date();c.setDate(c.getDate()-parseInt(range)+1);cut=ymd(c)}
  var by={};base.forEach(function(t){if(cut&&t.date<cut)return;(by[t.date]=by[t.date]||[]).push(t)});
  var dates=Object.keys(by).sort().reverse();
  h+='<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="flex:2;margin:0">Daily summary</h2><select id="d_range" style="margin:0"><option value="7"'+(range==='7'?' selected':'')+'>Last 7 days</option><option value="14"'+(range==='14'?' selected':'')+'>Last 14 days</option><option value="30"'+(range==='30'?' selected':'')+'>Last 30 days</option><option value="all"'+(range==='all'?' selected':'')+'>All time</option></select></div>';
  if(!dates.length)h+='<p class="mut">No activity in this period.</p>';
  else{h+='<div class="scroll"><table><tr><th>Date</th><th>In</th><th>Out</th><th>Net</th><th>#</th></tr>'+dates.map(function(k){var x=sum(by[k]),n=x.i-x.o;return '<tr><td>'+esc(k)+'</td><td class="in">'+fmt(x.i)+'</td><td class="out">'+fmt(x.o)+'</td><td class="'+(n>=0?'in':'out')+'">'+fmt(n)+'</td><td>'+x.n+'</td></tr>'}).join('')+'</table></div>'}
  h+='</div>';
  // per user
  if(admin){
    var names={};Object.keys(users).forEach(function(k){names[k]=1});txs.forEach(function(t){names[t.user]=1});
    h+='<div class="card"><h2>By user</h2><div class="scroll"><table><tr><th>User</th><th>In</th><th>Out</th><th>Balance</th><th>#</th></tr>'+Object.keys(names).sort().map(function(k){var x=sum(txs.filter(function(t){return t.user===k}));return '<tr><td>'+esc(k)+(users[k]?'':' <span class="mut">(removed)</span>')+'</td><td class="in">'+fmt(x.i)+'</td><td class="out">'+fmt(x.o)+'</td><td>'+fmt(x.i-x.o)+'</td><td>'+x.n+'</td></tr>'}).join('')+'</table></div></div>';
  }
  // recent activity
  var rec=base.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)}).slice(0,10);
  h+='<div class="card"><h2>Recent activity</h2>';
  if(!rec.length)h+='<p class="mut">Nothing yet. Add your first entry in the Entries tab.</p>';
  rec.forEach(function(t){h+='<div class="tx"><div><div class="n">'+esc(nt(t)||'(no notes)')+'</div><div class="m">'+esc(t.user)+' added · '+esc(t.date)+(t.ts?' · '+new Date(t.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'')+'</div></div><div class="a '+(t.type==='in'?'in':'out')+'"><b>'+(t.type==='in'?'+':'−')+fmt(t.amount)+'</b></div></div>'});
  return h+'</div>';
}

function txHtml(admin){
  var base=txs.filter(function(t){return admin?(fuser==='all'||t.user===fuser):t.user===me}).sort(cmp);
  var bal=0,B={};base.forEach(function(t){bal+=t.type==='in'?t.amount:-t.amount;B[t.id]=bal});
  var td=today(),mo=td.slice(0,7),yr=td.slice(0,4),wk=new Date();wk.setDate(wk.getDate()-((wk.getDay()+6)%7));var ws=ymd(wk),qq=q.trim().toLowerCase();
  var list=base.filter(function(t){
    var d=t.date||'';
    if(period==='daily'&&d!==td)return false;if(period==='weekly'&&d<ws)return false;if(period==='monthly'&&d.slice(0,7)!==mo)return false;if(period==='yearly'&&d.slice(0,4)!==yr)return false;
    if(qq&&(nt(t)+' '+(t.desc||'')+' '+t.user+' '+t.amount).toLowerCase().indexOf(qq)<0)return false;return true}).reverse();
  var ti=0,to=0;list.forEach(function(t){t.type==='in'?ti+=t.amount:to+=t.amount});
  var P=[['all','All'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']];
  var h='<div class="chips">'+P.map(function(x){return '<button class="chip '+(period===x[0]?'on':'')+'" data-p="'+x[0]+'">'+x[1]+'</button>'}).join('')+'<button class="chip" id="sbtn">🔍</button></div>';
  if(showQ)h+='<div class="pad" style="padding-bottom:0"><input id="q" placeholder="Search notes, amount, user" value="'+esc(q)+'"></div>';
  if(admin)h+='<div class="pad" style="padding-bottom:0"><select id="e_user"><option value="all">All users</option>'+Object.keys(users).sort().map(function(k){return '<option'+(fuser===k?' selected':'')+'>'+esc(k)+'</option>'}).join('')+'</select></div>';
  if(admin&&fuser!=='all')h+='<div class="pad" style="padding-bottom:0"><div class="card row" style="margin:0;justify-content:space-between;flex-wrap:nowrap"><span>Viewing cashbook of <b>'+esc(fuser)+'</b></span><button class="sm" data-all="1" style="flex:none">Show all</button></div></div>';
  h+='<div class="ch"><span>Date</span><span class="in">Cash In</span><span class="out">Cash Out</span></div>';
  if(!list.length)h+='<p class="mut pad">No entries found.</p>';
  var last='';
  list.forEach(function(t){
    if(t.date!==last){last=t.date;h+='<div class="dh">'+esc(dlabel(t.date))+'</div>'}
    var inn=t.type==='in';
    h+='<div class="er" data-e="'+esc(t.id)+'"><div class="el"><div class="t">'+esc(nt(t)||'(no notes)')+'</div>'+(t.desc?'<div class="d">'+esc(t.desc)+'</div>':'')+'<div class="tm">'+esc(t12(tm(t)))+(admin?' · '+esc(t.user):'')+'</div></div>'+
    (inn?'<div class="ei">'+fn(t.amount)+'</div>':'<div class="eo">'+fn(t.amount)+'</div>')+'<div class="eb">Balance '+fn(B[t.id])+'</div></div>';
  });
  h+='<div class="fixb"><div class="bbtn"><button class="gi" data-new="in">Cash In</button><button class="go" data-new="out">Cash Out</button></div><div class="tot"><div><small class="in">Total Cash In</small><b class="in">'+fn(ti)+'</b></div><div><small class="out">Total Cash Out</small><b class="out">'+fn(to)+'</b></div><div><small>Balance</small><b>'+fn(ti-to)+'</b></div></div></div>';
  return h;
}

function usersHtml(){
  var h='<div class="card"><h2>Create user login</h2><input id="nu_n" placeholder="Username" autocapitalize="none"><input id="nu_p" type="password" placeholder="Password (min 6 chars)">'+
  '<div class="err" id="e">'+esc(err)+'</div><button class="p" id="cu">Create user</button></div>';
  h+='<div class="card"><h2>All users</h2>';
  Object.keys(users).sort().forEach(function(k){
    var u=users[k],ti=0,to=0,n=0;txs.forEach(function(t){if(t.user===k){n++;t.type==='in'?ti+=t.amount:to+=t.amount}});
    h+='<div class="tx" style="flex-direction:column;gap:8px"><div class="row" style="justify-content:space-between"><div><div class="n">'+esc(k)+'</div><div class="m">'+(u.role==='admin'?'Admin (you)':'User')+' · '+n+' entries</div></div><div style="text-align:right"><div class="m">In <b class="in">'+fmt(ti)+'</b> · Out <b class="out">'+fmt(to)+'</b></div><div><b>Balance '+fmt(ti-to)+'</b></div></div></div>'+
    '<div class="row"><button class="sm p" data-vu="'+esc(k)+'">View cashbook</button>'+(u.role==='admin'?'':'<button class="sm" data-rp="'+esc(k)+'">Reset password</button><button class="sm" data-du="'+esc(k)+'">Delete</button>')+'</div></div>';
  });
  return h+'</div>';
}

function bind(admin){
  var $=function(x){return app.querySelectorAll(x)},G=function(i){return document.getElementById(i)};
  G('out')&&(G('out').onclick=function(){closeMenu();signout()});
  G('menu').onclick=openMenu;
  $('[data-close]').forEach(function(b){b.onclick=closeMenu});
  $('[data-m]').forEach(function(b){b.onclick=function(){tab=b.dataset.m;err='';closeMenu();window.scrollTo(0,0)}});
  $('[data-t]').forEach(function(b){b.onclick=function(){tab=b.dataset.t;err='';render()}});
  $('[data-p]').forEach(function(b){b.onclick=function(){period=b.dataset.p;render()}});
  if(G('sbtn'))G('sbtn').onclick=function(){showQ=!showQ;if(!showQ)q='';focusQ=showQ;render()};
  if(G('q'))G('q').oninput=function(e){q=e.target.value;focusQ=true;render()};
  if(G('e_user'))G('e_user').onchange=function(e){fuser=e.target.value;render()};
  if(G('d_user'))G('d_user').onchange=function(e){fuser=e.target.value;render()};
  if(G('d_range'))G('d_range').onchange=function(e){range=e.target.value;render()};
  $('[data-vu]').forEach(function(b){b.onclick=function(){fuser=b.dataset.vu;tab='tx';period='all';render();window.scrollTo(0,0)}});
  $('[data-all]').forEach(function(b){b.onclick=function(){fuser='all';render()}});
  $('[data-new]').forEach(function(b){b.onclick=function(){form=newForm(b.dataset.new);if(admin&&fuser!=='all')form.user=fuser;err='';render()}});
  $('[data-e]').forEach(function(r){r.onclick=function(){var t=txs.find(function(x){return x.id===r.dataset.e});if(t){form={id:t.id,user:t.user,ts:t.ts,type:t.type,date:t.date,time:tm(t),amount:String(t.amount),notes:nt(t),desc:t.desc||''};err='';render()}}});
  var cu=G('cu');
  if(cu)cu.onclick=async function(){
    var n=uname(G('nu_n').value),p=G('nu_p').value;
    if(!n)return seterr('Enter a username');if(p.length<6)return seterr('Password must be at least 6 characters');
    try{await api('POST','/users',{username:n,password:p});err='';await reload()}catch(e){seterr(e.message)}
  };
  $('[data-du]').forEach(function(b){b.onclick=async function(){var k=b.dataset.du;if(confirm('Delete user "'+k+'"? Their entries are kept.')){try{await api('DELETE','/users/'+encodeURIComponent(k));if(fuser===k)fuser='all';await reload()}catch(e){alert(e.message)}}}});
  $('[data-rp]').forEach(function(b){b.onclick=async function(){var k=b.dataset.rp,p=prompt('New password for '+k+' (min 6 chars)');if(!p||p.length<6)return;try{await api('PUT','/users/'+encodeURIComponent(k)+'/password',{password:p});alert('Password updated')}catch(e){alert(e.message)}}});
}

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();inst=e;refresh()});
window.addEventListener('popstate',function(){if(menu){menu=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
window.addEventListener('appinstalled',function(){inst=null;refresh()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

init();
})();
</script>
